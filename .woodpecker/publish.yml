name: Publish Docker Image

when:
  - event: push
    branch: main

steps:
  - name: build-and-push
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: ghcr.io
      repo: ghcr.io/iostpa/api
      tags: latest
      context: .
      username: iostpa
      password:
        from_secret: git_token
